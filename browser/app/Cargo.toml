[package]
name = "app"
edition = "2024"
publish = false

[[bin]]
name = "app"

[[bin]]
name = "app_helper"
path = "src/mac/helper.rs"

[[bin]]
name = "bundle_app"
path = "src/mac/bundle_app.rs"

[features]
default = ["sandbox"]
sandbox = ["cef/sandbox"]

[dependencies]
cef.workspace = true
cef-dll-sys.workspace = true
parking_lot = "0.12"
once_cell = "1.19"
tokio = { version = "1", features = ["time"] }

egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"
wgpu = "22"
winit = { version = "0.30", features = [] }
pollster = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
plist.workspace = true
serde.workspace = true
